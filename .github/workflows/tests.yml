name: PR-Hunter checks
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Start app and check module content type
        run: |
          npm run dev > /tmp/pr-hunter-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --dump-header - --output /dev/null http://localhost:4173/dm-assistant.mjs
      - name: Exercise mobile and iPad DM workspace
        run: node tests/dm-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
